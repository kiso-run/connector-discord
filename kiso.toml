[kiso]
type = "connector"
name = "discord"
version = "0.1.0"
description = "Discord bridge for Kiso"

[kiso.connector]
platform = "discord"

[kiso.connector.env]
bot_token = { required = true, description = "Discord bot token — create at discord.com/developers/applications → New Application → Bot → Reset Token" }
kiso_token = { required = true, description = "Kiso API token — any token listed under [users] in ~/.kiso/config.toml, or the deploy token in [tokens]" }
webhook_secret = { required = false, description = "Webhook signature secret — any random string, e.g.: openssl rand -hex 32" }

[kiso.deps]
python = ">=3.11"
